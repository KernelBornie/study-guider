<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg-grad)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="12 12" />

  <!-- Shield Shape with Glow -->
  <g filter="url(#glow)">
    <path d="M 256 70 C 350 70 395 105 395 180 C 395 295 285 390 256 420 C 227 390 117 295 117 180 C 117 105 162 70 256 70 Z"
          fill="url(#shield-grad)" stroke="#60a5fa" stroke-width="6" />
  </g>

  <!-- Inner Crest Pattern -->
  <path d="M 256 95 C 330 95 365 125 365 185 C 365 275 278 355 256 380 C 234 355 147 275 147 185 C 147 125 182 95 256 95 Z"
        fill="#0f172a" opacity="0.6" />

  <!-- Graduation Cap (Mortarboard) -->
  <!-- Cap Top Diamond -->
  <polygon points="256,140 340,175 256,210 172,175" fill="#ffffff" />
  <!-- Cap Skull Cap Underneath -->
  <path d="M 200 190 L 200 225 C 200 248 312 248 312 225 L 312 190 Z" fill="#e2e8f0" />
  <!-- Tassel Ribbon & Drop -->
  <path d="M 256 175 C 315 175 330 195 332 230" fill="none" stroke="url(#gold-grad)" stroke-width="5" stroke-linecap="round" />
  <circle cx="332" cy="235" r="7" fill="url(#gold-grad)" />

  <!-- Open Book / Exam Paper Motif -->
  <g transform="translate(186, 260)">
    <!-- Left page -->
    <path d="M 70 50 C 45 42 10 42 0 52 L 0 102 C 10 92 45 92 70 100 Z" fill="#f8fafc" />
    <!-- Right page -->
    <path d="M 70 50 C 95 42 130 42 140 52 L 140 102 C 130 92 95 92 70 100 Z" fill="#f8fafc" />
    <!-- Page lines left -->
    <line x1="12" y1="65" x2="58" y2="65" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="76" x2="58" y2="76" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="87" x2="45" y2="87" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Page lines right -->
    <line x1="82" y1="65" x2="128" y2="65" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="82" y1="76" x2="128" y2="76" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="82" y1="87" x2="115" y2="87" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Center spine -->
    <line x1="70" y1="48" x2="70" y2="102" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- UNZA Banner / Text -->
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#60a5fa">UNZA PORTAL</text>
</svg>
